schema: spec-driven
context: |
  自宅のカクテルを家主の在庫から客人が注文するWebサービス。仕様は日本語。
  現行仕様はspecs/、改修設計はchanges/web-service-migration/、公開手順はdocs/DEPLOYMENT.md。
  Cloudflare Pages + Service binding経由のWorkers + D1。R2は使用しない。
  家主はFirebase AuthenticationのGoogleログイン。1家主1バーで在庫・注文・招待を分離する。
  客人は登録不要で招待QRとニックネームから参加し、バー別Cookieで識別する。
  在庫は「ある／ない」。水と氷は常備品。同一の有効kind_idで代用できる。
  注文は1杯ずつ、受付→提供完了。客人キャンセル・残量減算・音やプッシュ通知は対象外。
  カタログはdata/rawのCSV由来。version付きでD1へ配備する。
  買い足しの厳密探索はブラウザーWeb Workerで実行する。
  旧LAN版のchangeとdocs/LEGACY-LAN.mdは履歴であり、現行仕様を制限しない。
  クラウド版実装はローカル検証済み。本番設定・Google実認証・クラウド配備は未完了。
