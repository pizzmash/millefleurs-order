schema: spec-driven
context: |
  自宅で客人がカクテルを注文し、家主が在庫と注文を管理するWebアプリ。
  仕様は日本語で記述する。初期版の機能範囲は相談済み。詳細仕様・設計・実装タスクを作成する。
  取り込み元: data/raw/（/home/daxubar/python/cocktaillog_crawler/data からコピー済み）
  必要な正規化を取り込み処理で行う。プロジェクトはGit管理する。
  drink_idが異なっても、有効なkind_idが同じ材料は代用可能とする。
  初期版は自宅Wi-Fi内で利用する。
  在庫は「ある／ない」で管理し、お酒・ジュース・シロップ・果物を登録対象とする。
  水と氷は常備品として扱う。
  客人はQRコードとニックネームで参加する。アカウント登録は不要。
  注文は1杯ずつ行い、客人が自分の注文状況を確認できる。
  注文状態は「受付 → 提供完了」の2状態。客人側のキャンセル機能は設けない。
  家主画面には初期版ではパスワードやログインを設けない。
  カクテル名・材料名で検索し、お酒の種類と度数で絞り込む。
  家主による個別カクテルの非表示機能は設けない。
  レシピ指定の材料を優先し、なければ家主が作る際に同じkind_idの在庫から代用品を選ぶ。
  サーバーは現在のWindows PC内のWSL2環境で動かす。
  家主・客人ともスマートフォンで利用する。
  デザインは暗めで落ち着いたバー風。
  注文履歴は継続保存し、受付中を優先表示する。会の開始・終了操作は設けない。
  画面を開いている間は注文を自動更新する。通知は画面内のみで音・プッシュ通知は不要。
  技術構成と境界条件はchanges/add-home-cocktail-ordering/design.mdに記載する。
